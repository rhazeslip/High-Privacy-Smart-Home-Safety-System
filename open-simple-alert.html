<!DOCTYPE html>
<html>
<head>
    <title>Open Alert Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
        }
        .note {
            margin-top: 30px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            font-size: 14px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Alert Creator</h1>
        <p>Click the button below to open the simple alert creator. Your browser will ask you to accept the self-signed certificate.</p>
        <a href="https://127.0.0.1:8001/simple-alert.html" target="_blank">Open Alert Creator</a>
        <div class="note">
            <strong>⚠️ Certificate Warning:</strong><br>
            When prompted, click "Advanced" and then "Proceed to 127.0.0.1 (unsafe)" to accept the self-signed certificate.
        </div>
    </div>
</body>
</html>
